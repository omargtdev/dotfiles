"$schema" = 'https://starship.rs/config-schema.json'

format = """
$git_branch\
$git_commit \
$azure\
$kubernetes\
$cmd_duration\
$line_break\
$directory\
$character"""

[cmd_duration]
min_time = 1000

[line_break]
disabled = false

[azure]
symbol = " "
disabled = false
format = '[$symbol($username)]($style) '

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)'

[git_commit]
format = '[\($hash$tag\)]($style)'

[kubernetes]
symbol = " "
disabled = false
format = '[$symbol$context(\($namespace\))]($style) '
